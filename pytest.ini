[pytest]
testpaths = test/tests
pythonpath = build src
addopts = -m "not slow and not mid"
markers =
    mid: full-pipeline / BDB round-trip / interchange / floorplanner integration; deselected by default, run with `bb -m` or `bb -s`
    slow: heavy optimizer/SA-GA tests (~19s); deselected by default, run with `bb -s`
    needs_flock: asserts real inter-process lock exclusion; auto-skipped where
        fcntl is absent (Windows), whose no-op flock fallback cannot provide it
    landed: (feature tag) spec matches shipped behavior — bound & green, or narrative with named test_*.py coverage
    future: (feature tag) spec ahead of code — not bound or xfail, carries a docs pointer
    doc: (feature tag) narrative mirror by design; executable tests live in a hand-written test_*.py
    orphaned: (feature tag) kept for reference, bound to nothing, not maintained
