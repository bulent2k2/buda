name: JCC A/B (temporary)

# TEMPORARY, for PR #968 only: it is deleted before that PR leaves draft.
#
# PR #968 turns on BUDA_JCC_MITIGATION (the assembler pads jumps off 32-byte
# boundaries, docs/internal/jcc_erratum.md).  Its runtime evidence so far is
# from a Cascade Lake VM, which the Intel JCC erratum affects, plus one
# PARALLEL single-run corpus sweep on a runner (pr-qor.yml), which cannot
# resolve a few-percent effect.  This measures the flag where the erratum
# does not apply: ONE commit built twice, the flag OFF and ON, and swept
# serially (-j 1) in the order OFF ON ON OFF so drift hits both arms alike.
# Two matrix jobs so two runners, possibly two CPU models, are sampled; each
# names its CPU.  Triggered only by a PUSH that changes this file (a
# pull_request path filter would match the whole PR diff and re-run it on
# every later push).

on:
  push:
    branches:
      - claude/dnuts-corner-overlap-nthbr3
    paths:
      - '.github/workflows/jcc-ab.yml'

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      BUDA_ARCH: x86-64-v2
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 matplotlib

      - name: Record the runner's CPU
        run: |
          {
            echo "## Runner CPU (sample ${{ matrix.sample }})"
            echo '```'
            lscpu | grep -E '^\s*(Model name|CPU family|Model|Stepping|CPU\(s\)):'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch corpus inputs
        run: python3 flow/ariane133/fetch.py

      - name: Build the same commit with the flag OFF and ON
        run: |
          set -euo pipefail
          for arm in off on; do
            flag=OFF; [ "$arm" = on ] && flag=ON
            cmake -S . -B "build-$arm" -DBUDA_ARCH="$BUDA_ARCH" \
                  -DBUDA_JCC_MITIGATION="$flag" > "cfg-$arm.log"
            grep "JCC-erratum" "cfg-$arm.log" || echo "(no JCC line: $arm)"
            cmake --build "build-$arm" -j4 > "build-$arm.log" 2>&1 \
              || { tail -50 "build-$arm.log"; exit 1; }
            python3 tools/jcc_audit.py "build-$arm"/buda.cpython-*.so
          done

      - name: Sweep OFF ON ON OFF, serially
        run: |
          set -euo pipefail
          sweep() {  # sweep <arm> <out>: build/ is the arm's build for this sweep
            ln -sfn "build-$1" build
            python3 -c "import sys; sys.path.insert(0, 'build'); import buda; print(buda.__file__)"
            python3 tools/qor_corpus.py --out "$2" -j 1 > "$2.log" 2>&1 \
              || { tail -40 "$2.log"; exit 1; }
            python3 tools/qor_corpus.py --check "$2"
            echo "$(date -u +%H:%M:%S) $1 -> $2"
          }
          sweep off off1.json
          sweep on  on1.json
          sweep on  on2.json
          sweep off off2.json

      - name: Compare
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          def load(n):
              return {r["flow"]: r for r in json.load(open(n + ".json"))["rows"]}
          S = {n: load(n) for n in ("off1", "off2", "on1", "on2")}
          ok = lambda r: r is not None and not r.get("err") and isinstance(r.get("sec"), (int, float))
          flows = [f for f in S["off1"] if all(ok(S[n].get(f)) for n in S)]
          keys = ("overlaps", "unplaced", "viol_bundles", "abstract_wl", "detailed_wl")
          same = sum(len({tuple(S[n][f].get(k) for k in keys) for n in S}) == 1 for f in flows)
          print(f"## JCC flag, OFF vs ON, serial ABBA ({len(flows)} flows, routes identical in {same})")
          def mean(fs, a):
              return sum((S[a + "1"][f]["sec"] + S[a + "2"][f]["sec"]) / 2 for f in fs)
          def spread(fs, a):
              return abs(sum(S[a + "1"][f]["sec"] for f in fs) - sum(S[a + "2"][f]["sec"] for f in fs))
          def row(label, fs):
              x, y = mean(fs, "off"), mean(fs, "on")
              sp = max(spread(fs, "off"), spread(fs, "on"))
              pct = f"{100 * (y - x) / x:+.1f} %" if x >= 0.5 else "-"
              print(f"| {label} | {x:.1f} | {y:.1f} | {pct} | ±{sp:.1f} s |")
          print("| Flows | OFF, s | ON, s | change | run-to-run spread |")
          print("|---|---|---|---|---|")
          row(f"**all** ({len(flows)})", flows)
          by = {}
          for f in flows:
              s = f.replace("flow/", "")
              by.setdefault(s.split("/")[0] if "/" in s else "(root)", []).append(f)
          for c in sorted(by, key=lambda c: -mean(by[c], "off")):
              if mean(by[c], "off") >= 1.0:
                  row(f"`{c}` ({len(by[c])})", by[c])
          print()
          print("per flow, |change| >= 1 s:")
          for f in sorted(flows, key=lambda f: -abs(mean([f], "on") - mean([f], "off"))):
              x, y = mean([f], "off"), mean([f], "on")
              if abs(y - x) < 1.0:
                  break
              print(f"    {f}: {x:.1f} -> {y:.1f} ({100 * (y - x) / x:+.1f} %), "
                    f"runs off {S['off1'][f]['sec']:.1f}/{S['off2'][f]['sec']:.1f}, "
                    f"on {S['on1'][f]['sec']:.1f}/{S['on2'][f]['sec']:.1f}")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jcc-ab-${{ matrix.sample }}-${{ github.sha }}
          path: |
            off1.json
            off2.json
            on1.json
            on2.json
          if-no-files-found: warn
          retention-days: 30
