name: Windows validation

# Validate docs/WINDOWS_REQ.md + docs/WINDOWS_BUILD.md against a REAL Windows
# machine (hosted windows-2022 runner, VS 2022), by executing the documented
# steps as literally as CI allows.  This is a DOC-VALIDATION harness, not a
# gate: it exists so those two pages describe measured reality instead of
# untested intention, and it runs only on demand.
#
# Both documented paths are exercised as separate jobs:
#   ninja    — "3. Build With Ninja"            (vcvars64 + Ninja, single-config)
#   msbuild  — "4. Build With Visual Studio"    (VS 17 2022 generator, x64)
#
# Deviations from the docs, each deliberate and noted inline:
#   * --no-viz on the flow run (flow/four_blocks.buda ends in `visualize`,
#     which opens a Tk window; CI must not block on a GUI).
#   * MPLBACKEND=Agg for tests, same as the Linux gate.
#   * src/web/requirements.txt is installed — without it 28 web tests
#     silently skip (the exact hole the Linux gate's skip-guard exists for).

on:
  # Manual only.  Nine iteration runs took the docs from untested intention to
  # a green end-to-end pipeline; from here this is an on-demand re-validation
  # vehicle for docs/WINDOWS_REQ.md + docs/WINDOWS_BUILD.md, not a gate.
  workflow_dispatch:

concurrency:
  group: windows-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ninja:
    # PINNED image, same philosophy as the ubuntu-24.04 pin in ci.yml: this
    # harness measures "does the doc work on VS 2022 / Windows Server 2022";
    # a silent label migration would change the question.
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      MPLBACKEND: Agg
      # Run 7 measured the classic Windows-Python trap: stdio defaults to the
      # legacy ANSI code page (cp1252), and the engine's log lines use Δ/→/×,
      # so prints die with UnicodeEncodeError('charmap', ...).  UTF-8 mode is
      # the documented remedy (docs/WINDOWS_REQ.md).
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Which interpreters exist (python3 lookup reality)
        # WINDOWS_REQ.md claims CMake's `python3` lookup is a portability
        # hazard because native Windows installs expose `python`/`py`, not
        # `python3`.  Record what THIS environment actually provides, so the
        # doc's claim is measured rather than assumed.
        shell: pwsh
        continue-on-error: true
        run: |
          where.exe python
          where.exe python3
          where.exe py
          python --version

      - name: Install Python packages (per WINDOWS_REQ.md, plus web deps)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 pytest pytest-bdd matplotlib numpy pytest-xdist ninja
          python -m pip install -r src/web/requirements.txt

      - name: Configure and build (Ninja, per WINDOWS_BUILD.md section 3)
        # Ninja needs the MSVC environment; the docs say "open a VS developer
        # shell".  The CI equivalent is vcvars64.bat, located via vswhere —
        # env vars do not persist across steps, so configure+build share one
        # cmd step.
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build
          if errorlevel 1 exit /b 1

      - name: Where did the artifacts land?
        # WINDOWS_BUILD.md claims Ninja puts the extension directly under
        # build\.  Verify, and record the DLL/PYD layout the import depends on.
        shell: pwsh
        run: Get-ChildItem -Recurse build -Include *.pyd,*.dll | Select-Object FullName,Length

      - name: Import smoke (diagnostics on stdout, via cmd)
        # cmd, not pwsh: runs 2 and 3 showed failing pwsh steps losing the
        # process output ENTIRELY (exit 1, zero text, not even the first
        # print).  cmd steps kept their output in run 1's build failure.
        # The diagnostics live in a committed file for the same reason —
        # no here-string generation to go wrong invisibly.
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build;%CD%\src;%CD%\tools"
          python -u -X faulthandler .github\scripts\windows_diag_import.py

      - name: Fast test tier (documented command, NO PYTHONPATH)
        # Deliberately no PYTHONPATH: WINDOWS_BUILD.md section 3 claims the
        # Ninja layout needs none for pytest -- pytest.ini's `pythonpath =
        # build src` covers the extension and src, and `python -m pytest` puts
        # the CWD (= repo root) on sys.path for the `tools` package.  Injecting
        # it here would let a break of that documented mechanism pass silently
        # (review #600).  The flow step below keeps PYTHONPATH because the doc
        # says plain `python` runs DO need it.
        shell: cmd
        run: python -m pytest -q -r fs

      - name: Run a .buda flow
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build;%CD%\src;%CD%\tools"
          python src\buda_cli.py --no-viz flow\four_blocks.buda

  msbuild:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      MPLBACKEND: Agg
      # Run 7 measured the classic Windows-Python trap: stdio defaults to the
      # legacy ANSI code page (cp1252), and the engine's log lines use Δ/→/×,
      # so prints die with UnicodeEncodeError('charmap', ...).  UTF-8 mode is
      # the documented remedy (docs/WINDOWS_REQ.md).
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 pytest pytest-bdd matplotlib numpy pytest-xdist
          python -m pip install -r src/web/requirements.txt

      - name: Configure and build (VS generator, per WINDOWS_BUILD.md section 4)
        # The VS generator locates MSVC itself — no developer shell needed.
        # Multi-config: the doc claims output lands under build\Release.
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Where did the artifacts land?
        shell: pwsh
        run: Get-ChildItem -Recurse build -Include *.pyd,*.dll | Select-Object FullName,Length

      - name: Import smoke (diagnostics on stdout, via cmd)
        # cmd, not pwsh: runs 2 and 3 showed failing pwsh steps losing the
        # process output ENTIRELY (exit 1, zero text, not even the first
        # print).  cmd steps kept their output in run 1's build failure.
        # The diagnostics live in a committed file for the same reason —
        # no here-string generation to go wrong invisibly.
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build\Release;%CD%\build;%CD%\src;%CD%\tools"
          python -u -X faulthandler .github\scripts\windows_diag_import.py

      - name: Fast test tier
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build\Release;%CD%\build;%CD%\src;%CD%\tools"
          python -m pytest -q -r fs

      - name: Run a .buda flow
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build\Release;%CD%\build;%CD%\src;%CD%\tools"
          python src\buda_cli.py --no-viz flow\four_blocks.buda

  cygwin:
    # Third path: Cygwin64 — Windows with a POSIX personality.  Unlike the two
    # MSVC jobs above this exercises the NON-MSVC branch of the build (Cygwin
    # GCC: -march/-ffp-contract=off, auto-exported DLL symbols, a real fcntl
    # and python3) and, most interestingly, the repo's own `bin/bb` wrapper —
    # which the docs tell native-Windows users does not apply.  If this job is
    # green, the Windows story gains a "the Linux instructions just work" lane.
    #
    # EXPERIMENTAL until measured green; known open questions this job is
    # designed to ANSWER rather than assume:
    #   * which Python Cygwin ships today (3.9 may be too old for the suite);
    #   * whether numpy/matplotlib exist as Cygwin packages (there are NO pip
    #     wheels for Cygwin — native deps come from setup.exe or not at all);
    #   * whether the web deps are installable (pydantic-core needs Rust:
    #     expected NO — recorded, not required).
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      # Cygwin bash reads CRLF scripts poorly; belt (autocrlf below) AND
      # suspenders: igncr makes bash ignore stray \r in anything it sources.
      SHELLOPTS: igncr

    steps:
      - name: Force LF checkout
        # The Windows runner image configures git with autocrlf=true, which
        # would hand Cygwin bash CRLF copies of bin/bb etc.
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Cygwin64
        # Official installer, quiet mode, kernel.org mirror.  The package list
        # is a CANDIDATE set: the diagnose step below records what actually
        # materialized (this container's proxy cannot reach the Cygwin package
        # inventory, so the runner doubles as the inventory probe).
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://cygwin.com/setup-x86_64.exe -OutFile setup-x86_64.exe
          .\setup-x86_64.exe -q -O -s https://mirrors.kernel.org/sourceware/cygwin/ `
            -R C:\cygwin64 -l C:\cygpkgs `
            -P gcc-g++,make,cmake,ninja,git,python3,python3-devel,python39-devel,python39-pip,python39-numpy,python39-tkinter,python39-matplotlib | Out-Null
          C:\cygwin64\bin\bash.exe -lc 'uname -a'

      - name: Diagnose the Cygwin environment
        # The inventory step: which python, which native deps resolved, what
        # pip can do.  continue-on-error — its job is to REPORT.  No -e: run
        # 14's -e aborted at the (genuinely broken) matplotlib import, so the
        # tkinter and pip probes after it never reported.
        shell: cmd
        continue-on-error: true
        run: |
          C:\cygwin64\bin\bash.exe -lc "ls -la /usr/bin/python* 2>&1; python3 --version 2>&1; cygcheck -c -d | grep -iE 'python|gcc|cmake|ninja|make' 2>&1; python3 -c 'import numpy; print(\"numpy\", numpy.__version__)' 2>&1; python3 -c 'import matplotlib; print(\"matplotlib\", matplotlib.__version__)' 2>&1; python3 -c 'import tkinter; print(\"tkinter OK\")' 2>&1; python3 -m pip --version 2>&1; true"

      - name: pip install the pure-python test deps
        shell: cmd
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && python3 -m pip install --user pybind11 pytest pytest-bdd pytest-xdist"

      - name: pip install the web deps (expected to fail — recording, not requiring)
        # The fallback message MUST be quoted: run 14's unquoted parens were a
        # bash syntax error, so pip never even ran and continue-on-error hid
        # it — pydantic-core availability went UNMEASURED for two rounds.
        shell: cmd
        continue-on-error: true
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && python3 -m pip install --user -r src/web/requirements.txt && echo WEB DEPS OK || echo 'WEB DEPS UNAVAILABLE (expected: pydantic-core needs Rust; no Cygwin wheels)'"

      - name: Build with the repo's own wrapper (bin/bb)
        # THE point of this path: the documented-for-Linux command, verbatim.
        shell: cmd
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && ./bin/bb"

      - name: Where did the artifacts land?
        # No -e here: `ls a b c` fails when any glob has no match (there is no
        # *.so on Cygwin) and -e aborted the step BEFORE the trailing true
        # (measured, run 13).
        shell: cmd
        continue-on-error: true
        run: |
          C:\cygwin64\bin\bash.exe -lc "cd $(cygpath '%CD%') && ls -la build/ | grep -E 'dll$|so$|pyd$' || true"

      - name: Import smoke
        # PYTHONPATH was MISSING here in run 13 (harness omission); run 14's
        # repair then OVER-ESCAPED it — bash treats \$ inside double quotes as
        # a literal dollar, so PYTHONPATH arrived as the literal string
        # '$PWD/build:...' (measured: the diag printed it verbatim).  cmd does
        # not expand $, so no escaping is needed — $(cygpath ...) on this same
        # line has always expanded fine for exactly that reason.
        shell: cmd
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && PYTHONPATH=$PWD/build:$PWD/src:$PWD/tools python3 -u -X faulthandler .github/scripts/windows_diag_import.py"

      - name: Fast test tier
        # PATH must carry build/: Cygwin's dlopen follows Windows LoadLibrary
        # search (app dir, system dirs, PATH) and does NOT search the
        # importing module's own directory, so without this the extension
        # import dies with 'ImportError: No such file or directory' — the
        # dependent cygbuda_core.dll, not the module, is what's missing
        # (measured, run 17; the import-smoke step masks it by ctypes-loading
        # the core DLL by absolute path first).
        #
        # continue-on-error: run 14's inventory measured the distro
        # python39-matplotlib (3.5.1) broken against python39-numpy (2.0.1) —
        # '_ARRAY_API not found', an upstream Cygwin packaging skew, not ours.
        # Tests importing matplotlib will fail on that alone; run to MEASURE
        # the damage without blocking the flow step behind it.
        # --continue-on-collection-errors: run 19 measured the 3.9 annotation
        # fix complete (zero TypeErrors left) — the only collection errors are
        # the 24 matplotlib-importing modules hitting the distro skew, and
        # pytest's default INTERRUPT on them hides how much of the rest of
        # the tier passes.  Keep collecting so the lane reports a real
        # passed/failed/error census.
        # BUDA_THREADS=1: run 20 measured INTERMITTENT SIGSEGV (exit 2816 =
        # SIGSEGV<<8) in the C++ engine under Cygwin — the tier died 3 tests
        # in and the flow died in run_nuts, while run 19's identical-source
        # flow was clean.  Suspect: worker-thread stack size (Cygwin pthreads
        # default far smaller than Linux's 8MB; the main thread is fine).
        # Single-threading the engine pools is the discriminating experiment.
        shell: cmd
        continue-on-error: true
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && PATH=$PWD/build:$PATH BUDA_THREADS=1 python3 -m pytest -q -r fs --continue-on-collection-errors"

      - name: Run a .buda flow
        # PATH carries build/ for the same dlopen reason as the fast tier;
        # --threads 1 for the same segfault reason (run 20, see the tier
        # step's comment).
        shell: cmd
        run: |
          C:\cygwin64\bin\bash.exe -leo pipefail -c "cd $(cygpath '%CD%') && PATH=$PWD/build:$PATH PYTHONPATH=build:src:tools python3 src/buda_cli.py --threads 1 --no-viz flow/four_blocks.buda"

  mingw:
    # Fourth path: mingw-w64 — GCC producing NATIVE Windows binaries, driven
    # from bash.  One honesty note this job MEASURES rather than asserts:
    # "the mingw64 that comes with Git for Windows" is the SHELL, not the
    # toolchain — Git Bash ships no gcc/make.  (Run 14's inventory step makes
    # the illusion measurable: the runner's Git Bash DOES resolve gcc — at
    # /c/mingw64/bin, a SEPARATE toolchain the runner image pre-installs, with
    # ninja from Chocolatey and cmake from its own installer.  Nothing under
    # Git's tree.  A dev box without those extras gets ABSENT for all of
    # them.)  The compiler comes from MSYS2
    # (preinstalled on this runner; on a dev box: install MSYS2), and the
    # UCRT64 flavor is chosen deliberately: modern CPython links the UCRT, and
    # mixing CRTs across the extension boundary is the class of silent bug the
    # MSVC lane needed nine runs to characterize.
    #
    # Why this lane is interesting: unlike Cygwin, the binaries are native, so
    # they link the NATIVE CPython — and every pip wheel works (numpy,
    # matplotlib, even the web deps).  Cygwin's package-inventory problem does
    # not exist here.  Unlike MSVC, it is the GCC branch of the build
    # (-march, -ffp-contract=off) and mingw auto-exports DLL symbols.
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'

    steps:
      - name: Force LF checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: What does Git Bash actually provide? (the misconception, measured)
        # `shell: bash` on a Windows runner IS Git for Windows' bash.  Record
        # what a Git-Bash-only user really has before we reach for MSYS2.
        shell: bash
        continue-on-error: true
        run: |
          uname -a
          for t in gcc g++ make cmake ninja python python3; do
            printf '%-8s -> %s\n' "$t" "$(command -v $t || echo ABSENT)"
          done

      - name: Install the mingw-w64 toolchain (MSYS2 UCRT64)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja'
        env:
          MSYSTEM: UCRT64

      - name: Install Python packages (native CPython — wheels work here)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 pytest pytest-bdd matplotlib numpy pytest-xdist
          python -m pip install -r src/web/requirements.txt

      - name: Configure and build (UCRT64 gcc + Ninja, native CPython)
        # PATH gets the hosted CPython FIRST: its dir contains python3.exe, so
        # CMakeLists' python3 lookup and PYBIND11_FINDPYTHON both resolve to
        # the NATIVE interpreter (not an MSYS python — none is installed).
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -leo pipefail -c "export MSYSTEM=UCRT64 && source /etc/profile && export PATH=\"$(cygpath -u '%pythonLocation%'):$PATH\" && cd $(cygpath '%CD%') && which gcc g++ cmake ninja python3 && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build"

      - name: Where did the artifacts land?
        shell: pwsh
        continue-on-error: true
        run: Get-ChildItem -Recurse build -Include *.pyd,*.dll | Select-Object FullName,Length

      - name: DLL dependency reality (objdump)
        # The measured basis for every runtime-DLL claim in the docs: which
        # DLLs each artifact ACTUALLY imports.  A self-contained build shows
        # only system DLLs (KERNEL32, msvcrt/ucrt, python3xx) — any
        # libstdc++-6/libgcc_s_seh-1/libwinpthread-1 line here means the
        # static-runtime link options missed a target (run 14: buda_db.pyd).
        shell: cmd
        continue-on-error: true
        run: |
          C:\msys64\usr\bin\bash.exe -lc "cd $(cygpath '%CD%') && for f in build/*.dll build/*.pyd; do echo \"== $f\"; /ucrt64/bin/objdump -p \"$f\" | grep 'DLL Name' || true; done"

      - name: Import smoke
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build;%CD%\src;%CD%\tools"
          python -u -X faulthandler .github\scripts\windows_diag_import.py

      - name: Fast test tier (documented no-PYTHONPATH form)
        shell: cmd
        run: python -m pytest -q -r fs

      - name: Run a .buda flow
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\build;%CD%\src;%CD%\tools"
          python src\buda_cli.py --no-viz flow\four_blocks.buda
