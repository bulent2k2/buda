<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BUDA — Web Demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
         display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  #side { border-right: 1px solid #8884; padding: 10px; overflow: auto;
          display: flex; flex-direction: column; gap: 8px; }
  #main { position: relative; overflow: hidden; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  textarea { width: 100%; height: 120px; font: inherit; resize: vertical; }
  button { font: inherit; padding: 3px 8px; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #log { white-space: pre-wrap; background: #8881; padding: 6px; border-radius: 4px;
         max-height: 180px; overflow: auto; font-size: 12px; }
  #stages span { padding: 1px 6px; border-radius: 3px; margin-right: 3px; opacity: .4; }
  #stages span.on { opacity: 1; background: #2a72; }
  svg { width: 100%; height: 100%; display: block; }
  .blk { fill: #6cf2; stroke: #48c; stroke-width: 1; }
  .blk.container { fill: none; stroke-dasharray: 4 3; }
  .blklbl { fill: #48c; font-size: 10px; }
  .keepout { fill: #f443; stroke: #e33; stroke-width: 1; }
  .hanan { stroke: #8883; stroke-width: .5; stroke-dasharray: 2 3; }
  .seg { stroke-width: 2.5; fill: none; }
  .seg.H { stroke: #e6a; } .seg.V { stroke: #4ad; } .seg.jog { stroke: #fa0; }
  .bt { fill: #0bd; } .rcv { fill: none; stroke: #d0b; stroke-width: 1.5; }
  .track { stroke: #2a7; stroke-width: 2; } .trackftp { fill: #2a73; }
  .bit { stroke: #08a; stroke-width: 1; } .bit.H { stroke: #e83; }
  .via { fill: #f60; stroke: #a30; stroke-width: .5; }
  .overlap { fill: #f005; stroke: #f00; stroke-width: 1; }
  #candbar, #focusbar { position: absolute; top: 8px; left: 8px; background: #000a;
             color: #fff; padding: 6px 10px; border-radius: 5px; }
  #candbar button, #focusbar button { background: #fff2; color: #fff; border: 1px solid #fff4; }
  #editpanel { border: 1px solid #8884; border-radius: 4px; padding: 6px;
               display: flex; flex-direction: column; gap: 5px; }
  #editverdict { font-size: 12px; }
  #editverdict.ok { color: #2a7; } #editverdict.bad { color: #e33; }
  .seg.edit { stroke-dasharray: none; opacity: 1; }
  #running { position: absolute; top: 8px; right: 8px; background: #2a7c;
             color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
  #running::before { content: "\25CF"; margin-right: 6px;
                     animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<div id="side">
  <h1>BUDA — Web Demo</h1>
  <div id="stages">
    <span data-k="bundler">bundler</span><span data-k="topologies">topo</span
    ><span data-k="planner">planner</span><span data-k="nuts">nuts</span
    ><span data-k="dnuts">dnuts</span>
  </div>
  <div class="row">demo:
    <select id="demo" onchange="loadDemo()" style="flex:1;font:inherit"></select>
  </div>
  <textarea id="cmds"></textarea>
  <div class="row">
    <button onclick="runCmds()">Run commands</button>
    <button onclick="reset()">Reset</button>
  </div>
  <div class="row">
    <button onclick="runDemoStage('bundler')">bundler</button>
    <button onclick="runDemoStage('topologies')">topologies</button>
    <button onclick="runDemoStage('planner')">planner</button>
    <button onclick="runDemoStage('nuts')">nuts</button>
    <button onclick="runDemoStage('dnuts')">dnuts</button>
    <button onclick="runStage('ripup')">ripup</button>
    <button onclick="runStage('negotiate')">negotiate</button>
    <button onclick="runCheck()">check</button>
  </div>
  <div class="row">view:
    <button onclick="setView('generation')">topo</button>
    <button onclick="setView('nuts')">NUTS</button>
    <button onclick="setView('detailed')">detailed</button>
  </div>
  <div class="row">bdb:
    <input id="bdbpath" value="/tmp/buda_demo.bdb" style="flex:1;font:inherit" />
    <button onclick="bdbOpen()">Open</button>
    <button onclick="bdbSave()">Save</button>
    <button onclick="bdbLoad()">Load</button>
  </div>
  <div id="log"></div>
  <div id="editpanel" hidden>
    <b>edit</b> <span id="editsrc"></span>
    <div id="editverdict"></div>
    <div class="row">
      <input id="editop" placeholder="edit_add_trunk H 700" style="flex:1;font:inherit" />
      <button onclick="editApply()">Apply</button>
    </div>
    <div class="row">
      <button onclick="editCommit(false)">Commit</button>
      <button onclick="editCommit(true)">Commit + pin</button>
      <button onclick="editAbort()">Abort</button>
    </div>
    <div style="font-size:11px;opacity:.7">ops: edit_add_trunk H|V &lt;perp&gt; · edit_add_stub &lt;block&gt; &lt;seg&gt; · edit_set_span &lt;seg&gt; &lt;lo&gt; &lt;hi&gt; · edit_connect &lt;i&gt; &lt;j&gt; · edit_remove_segment &lt;seg&gt;</div>
  </div>
</div>
<div id="main">
  <div id="running" hidden></div>
  <div id="candbar" hidden>
    <button onclick="stepCand(-1)">◀</button>
    <button onclick="stepCand(1)">▶</button>
    <span id="candlbl"></span>
    <button id="pinbtn" onclick="pinToggle()">Pin</button>
    <button onclick="editOpen()">Edit</button>
    <button onclick="editOpen('new')">Edit new</button>
  </div>
  <div id="focusbar" hidden>
    <button onclick="stepBundle(-1)">◀</button>
    <button onclick="stepBundle(1)">▶</button>
    <span id="focuslbl"></span>
  </div>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
const API = "/api";
let RENDER = null, CAND = 0, VIEW = "generation", EDIT = null;
let DEMOS = [], ACTIVE = null, BUNDLE_FOCUS = null;   // BUNDLE_FOCUS: null = show all

async function post(path, body) {
  const r = await fetch(API + path, {method: "POST",
      headers: {"content-type": "application/json"}, body: JSON.stringify(body || {})});
  return r.json();
}
async function get(path) { return (await fetch(API + path)).json(); }

function log(txt) { document.getElementById("log").textContent = txt; }
function showStages(state) {
  for (const el of document.querySelectorAll("#stages span"))
    el.classList.toggle("on", !!(state.stages_run || {})[el.dataset.k]);
}

async function runCmds() {
  const cmds = document.getElementById("cmds").value.split("\n").map(s => s.trim()).filter(Boolean);
  const res = await post("/command", {cmds});
  log(res.results.map(r => (r.ok ? "  " : "x ") + (r.summary || "(ok)")).join("\n"));
  showStages(res.state);
  await refresh();
}
async function reset() { showStages(await post("/reset", {})); RENDER = null; draw(); }
async function stage(cmd) {
  const res = await post("/command", {cmds: [cmd]});
  log(res.results.map(r => (r.ok ? "  " : "x ") + (r.summary || "(ok)")).join("\n"));
  showStages(res.state);
  await refresh();
}
async function setView(v) { VIEW = v; await refresh(); }

// ── demo picker ─────────────────────────────────────────────────────────────
// The catalog (GET /api/demos) gives each demo its setup text + a per-stage
// command map, so the same "setup + click stages" UX drives the flat AND the
// hierarchy-aware flow (which needs run_hier_bundler / run_planner hier / …).
async function initDemos() {
  DEMOS = (await get("/demos")).demos || [];
  const sel = document.getElementById("demo");
  sel.innerHTML = "";
  DEMOS.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = d.label; sel.appendChild(o);
  });
  if (DEMOS.length) loadDemo();
}
function loadDemo() {
  ACTIVE = DEMOS[+document.getElementById("demo").value || 0];
  document.getElementById("cmds").value = ACTIVE ? ACTIVE.setup : "";
}
// Long stages (planner/nuts/dnuts) keep the WS progress path — split the demo's
// command into the /api/stage key + args (e.g. "run_planner hier 5" -> args
// "hier 5"); the instant stages (bundler/topologies) post the command directly.
const WS_STAGE = {planner: "planner", nuts: "nuts", dnuts: "detailed_nuts"};
const WS_BASE  = {planner: "run_planner", nuts: "run_nuts", dnuts: "run_detailed_nuts"};
async function runDemoStage(key) {
  const cmd = (ACTIVE && ACTIVE.stages && ACTIVE.stages[key]) || key;
  if (WS_STAGE[key]) {
    const base = WS_BASE[key];
    const args = cmd.startsWith(base) ? cmd.slice(base.length).trim() : "";
    return runStage(WS_STAGE[key], args);
  }
  return stage(cmd);
}

// ── bundle focus (NUTS / detailed views) ────────────────────────────────────
function currentBundleIds() {
  const segs = VIEW === "nuts" ? (RENDER && RENDER.nuts && RENDER.nuts.segments)
             : VIEW === "detailed" ? (RENDER && RENDER.detailed && RENDER.detailed.net_segments)
             : null;
  if (!segs) return [];
  return [...new Set(segs.map(s => s.bundle_id))].sort((a, b) => a - b);
}
function stepBundle(d) {
  if (VIEW === "generation" || !RENDER) return;
  const ids = currentBundleIds();
  if (!ids.length) return;
  const ring = [null, ...ids];                 // null = "all bundles"
  let i = ring.indexOf(BUNDLE_FOCUS);
  if (i < 0) i = 0;
  BUNDLE_FOCUS = ring[(i + d + ring.length) % ring.length];
  draw();
}
function bundleAlpha(bid) {
  return (BUNDLE_FOCUS === null || bid === BUNDLE_FOCUS) ? 1 : 0.1;
}

// ── keyboard: step candidates (topo) / bundles (nuts, detailed) ─────────────
window.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select") return;
  const fwd = (e.key === "n" || e.key === "ArrowRight");
  const back = (e.key === "p" || e.key === "ArrowLeft");
  if (!fwd && !back) return;
  e.preventDefault();
  if (VIEW === "generation") stepCand(fwd ? 1 : -1);
  else stepBundle(fwd ? 1 : -1);
});

// ── long-running stages via WS progress (Phase 6) ──────────────────────────
// The stage buttons that can take tens of seconds go through /api/stage/{stage};
// the WS pushes started/heartbeat/done frames so the UI shows a live indicator.
const STAGE_MAP = {planner: "run_planner", nuts: "run_nuts",
                   detailed_nuts: "run_detailed_nuts", ripup: "ripup_reroute",
                   negotiate: "negotiate_congestion"};
function setRunning(txt) {
  const el = document.getElementById("running");
  el.hidden = !txt; if (txt) el.textContent = txt;
}
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/ws`);
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.kind === "stage" && f.status === "started")
      setRunning(`running ${f.name}…`);
    else if (f.kind === "heartbeat")
      setRunning(`running ${f.name}… ${f.elapsed}s`);
    else if (f.kind === "stage" && f.status === "done") {
      setRunning(null);
      if (f.state) showStages(f.state);
      if (f.notable && f.notable.length) log(f.notable.join("\n"));
      refresh();
    }
  };
  ws.onclose = () => { setRunning(null); setTimeout(connectWS, 1500); };
  ws.onerror = () => ws.close();
}
async function runStage(stage, args) {
  // Falls back to /api/command for the mapped instant commands if the stage
  // endpoint is somehow unavailable; normally the WS drives the indicator.
  setRunning(`running ${stage}…`);
  try {
    const res = await post("/stage/" + stage, {args: args || ""});
    if (res.error) {                             // unknown stage -> command path
      return stage(STAGE_MAP[stage] || stage);
    }
    log((res.notable && res.notable.length ? res.notable.join("\n") + "\n" : "")
        + (res.result.summary || "(ok)"));
    showStages(res.state);
    await refresh();
  } finally {
    setRunning(null);                            // done frame may have cleared it
  }
}
// check_design auto-detects its stage (topo / nuts / dnuts) from how far the
// pipeline has run — SERVER-side (buda_cmds/verify_viz_cmds.py) — so the client
// just runs a bare `check_design` and shows the full audit output. Read-only, so
// it does NOT refresh the render (no view/focus reset).
async function runCheck() {
  const res = await post("/command", {cmds: ["check_design"]});
  const r = res.results[0];
  log((r.log_lines && r.log_lines.length) ? r.log_lines.join("\n") : (r.summary || "(ok)"));
  showStages(res.state);
}
async function refresh() {
  BUNDLE_FOCUS = null;                  // a new stage / view starts showing all bundles
  const st = await get("/state");
  const sr = st.stages_run;
  // Auto-advance the view to the deepest available stage on a fresh run.
  if (VIEW === "detailed" && !sr.dnuts) VIEW = sr.nuts ? "nuts" : "generation";
  if (VIEW === "nuts" && !sr.nuts) VIEW = "generation";
  if (!sr.topologies) { RENDER = null; return draw(); }
  RENDER = await get("/render/" + VIEW + (VIEW === "generation" ? "?bundle=1" : ""));
  if (VIEW === "generation")
    CAND = Math.min(CAND, (RENDER.bundles[0]?.candidates.length || 1) - 1);
  draw();
}
function stepCand(d) {
  if (VIEW !== "generation") return;
  const n = RENDER?.bundles[0]?.candidates.length || 0;
  if (!n) return;
  CAND = (CAND + d + n) % n; draw();
}

// ── select / pin (Phase 3) ─────────────────────────────────────────────────
let PINNED_HERE = false;   // is the currently-shown candidate the pinned one?
function setPinBtn() {
  const b = document.getElementById("pinbtn");
  if (b) b.textContent = PINNED_HERE ? "Unpin" : "Pin";
}
// Pin the shown candidate, or unpin if it's already pinned (toggle).
async function pinToggle() {
  if (VIEW !== "generation" || !RENDER || EDIT) return;
  const res = PINNED_HERE
    ? await post("/unpin", {bundle: 1})
    : await post("/select", {bundle: 1, candidate: CAND});
  log(res.result.summary || (PINNED_HERE ? "unpinned" : "pinned"));
  showStages(res.state);
  await refresh();
}

// ── BDB checkpoint (Phase 5) ────────────────────────────────────────────────
function bdbPath() { return document.getElementById("bdbpath").value.trim(); }
async function bdbOpen() {
  // Open BEFORE routing so the stages persist into the file.
  const r = await post("/bdb/open", {path: bdbPath()});
  log(r.result.summary || (r.result.ok ? "bdb opened" : "open failed"));
  showStages(r.state);
}
async function bdbSave() {
  // The open .bdb is written live during routing, so "Save" is a save-AS
  // snapshot to a distinct file (save_bdb to the same path is rejected).
  const r = await post("/bdb/save", {path: bdbPath() + ".snap"});
  log(r.result.summary || (r.result.ok ? "snapshot saved" : "save failed"));
}
async function bdbLoad() {
  // Re-declares nothing here — replay your setup + Open first, then Load.
  const r = await post("/bdb/load_pipeline", {});
  log(r.result.summary || (r.result.ok ? "pipeline loaded" : "load failed"));
  showStages(r.state);
  await refresh();
}

// ── interactive edit ───────────────────────────────────────────────────────
function applyEdit(resp) {
  EDIT = resp.edit && resp.edit.open ? resp.edit : null;
  const panel = document.getElementById("editpanel");
  panel.hidden = !EDIT;
  if (EDIT) {
    document.getElementById("editsrc").textContent =
      `bundle ${EDIT.bundle_id} — ${EDIT.src || ""}`;
    const v = EDIT.verdict || {};
    const vd = document.getElementById("editverdict");
    vd.className = v.ok ? "ok" : "bad";
    vd.textContent = v.ok ? `ok · ${EDIT.topology.segments.length} segs · ${v.components} component(s)`
      : `NOT ok · ${(v.violations||[]).map(x=>x.kind).join(", ")} · ${v.components} component(s)`;
  }
  if (resp.result) log(resp.result.summary || (resp.result.ok ? "(ok)" : "(failed)"));
  draw();
}
async function editOpen(cand) {
  const c = cand === "new" ? "new" : CAND;
  VIEW = "generation";                          // an uncommitted edit is topo-only
  applyEdit(await post("/edit/open", {bundle: 1, candidate: c}));
}
async function editApply() {
  const cmd = document.getElementById("editop").value.trim();
  if (cmd) applyEdit(await post("/edit/op", {command: cmd}));
}
async function editCommit(pin) { applyEdit(await post("/edit/commit", {pin})); await refresh(); }
async function editAbort() { applyEdit(await post("/edit/abort", {})); }

// ── SVG rendering ──────────────────────────────────────────────────────────
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function bboxOf(fp) {
  let x1 = 1e18, y1 = 1e18, x2 = -1e18, y2 = -1e18;
  for (const b of fp.blocks) {
    x1 = Math.min(x1, b.bbox.x1); y1 = Math.min(y1, b.bbox.y1);
    x2 = Math.max(x2, b.bbox.x2); y2 = Math.max(y2, b.bbox.y2);
  }
  if (x1 > x2) { x1 = 0; y1 = 0; x2 = 1000; y2 = 1000; }
  return [x1, y1, x2, y2];
}
// The floorplan/hanan to draw against.  In the generation view each bundle now
// carries its OWN frame (`bundle.floorplan`/`bundle.hanan`) — a hier template
// bundle lives in a cell-local frame, not the die frame — so prefer the shown
// bundle's, falling back to the top-level payload (always right for the flat
// flow, and for the NUTS/detailed views which have no per-bundle floorplan).
function activeFrame() {
  if (VIEW === "generation" && RENDER.bundles && RENDER.bundles[0]) {
    const b = RENDER.bundles[0];
    if (b.floorplan && b.hanan) return {fp: b.floorplan, hanan: b.hanan};
  }
  return {fp: RENDER.floorplan, hanan: RENDER.hanan};
}
function draw() {
  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  document.getElementById("candbar").hidden = !RENDER;
  if (!RENDER) return;
  const {fp, hanan} = activeFrame();
  let [x1, y1, x2, y2] = bboxOf(fp);
  const pad = Math.max(x2 - x1, y2 - y1) * 0.06 + 50;
  x1 -= pad; y1 -= pad; x2 += pad; y2 += pad;
  // BUDA y grows UP; SVG y grows DOWN — flip via a group transform.
  const W = x2 - x1, H = y2 - y1;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const g = el("g", {transform: `translate(${-x1} ${y2}) scale(1 -1)`}, svg);

  for (const line of hanan.xs)
    el("line", {class: "hanan", x1: line, y1, x2: line, y2}, g);
  for (const line of hanan.ys)
    el("line", {class: "hanan", x1, y1: line, x2, y2: line}, g);
  for (const k of fp.keepouts)
    el("rect", {class: "keepout", x: k.bbox.x1, y: k.bbox.y1,
        width: k.bbox.x2 - k.bbox.x1, height: k.bbox.y2 - k.bbox.y1}, g);
  for (const b of fp.blocks) {
    // A multi-rect / TEG block is NOT solid over its whole bbox — draw each real
    // rect solid and only OUTLINE the bbox, so gaps (valid pass-through channels)
    // don't read as block area. Single-rect blocks (rects == []) fill the bbox.
    if (b.rects && b.rects.length) {
      for (const r of b.rects)
        el("rect", {class: "blk", x: r[0], y: r[1], width: r[2] - r[0], height: r[3] - r[1]}, g);
      el("rect", {class: "blk container",
          x: b.bbox.x1, y: b.bbox.y1,
          width: b.bbox.x2 - b.bbox.x1, height: b.bbox.y2 - b.bbox.y1}, g);
    } else {
      el("rect", {class: "blk" + (b.is_container ? " container" : ""),
          x: b.bbox.x1, y: b.bbox.y1,
          width: b.bbox.x2 - b.bbox.x1, height: b.bbox.y2 - b.bbox.y1}, g);
    }
    // label: a per-label group translated to the block's top-left (world coords,
    // y-up) then locally un-flipped so the text reads upright.
    const lg = el("g", {transform:
        `translate(${b.bbox.x1 + 4} ${b.bbox.y2 - 12}) scale(1 -1)`}, g);
    el("text", {class: "blklbl", x: 0, y: 0}, lg).textContent = b.name;
  }

  document.getElementById("candbar").hidden = (VIEW !== "generation");
  const showFocus = (VIEW === "nuts" || VIEW === "detailed");
  document.getElementById("focusbar").hidden = !showFocus;
  if (VIEW === "generation") drawGeneration(g, W, H);
  else if (VIEW === "nuts") drawNuts(g);
  else if (VIEW === "detailed") drawDetailed(g, Math.max(W, H));
  if (showFocus) updateFocusLabel();
}

function updateFocusLabel() {
  const ids = currentBundleIds();
  const lbl = document.getElementById("focuslbl");
  if (BUNDLE_FOCUS === null)
    lbl.textContent = `all ${ids.length} bundles · n/p to isolate one`;
  else
    lbl.textContent =
      `bundle ${BUNDLE_FOCUS} · ${ids.indexOf(BUNDLE_FOCUS) + 1}/${ids.length} · n/p to step`;
}

// A placed segment: perpendicular coord = track_position, extent = span_lo..hi
// along the routing direction. Returns [x1,y1,x2,y2] of the centerline.
function placedLine(s) {
  return s.horiz
    ? [s.span_lo, s.track_position, s.span_hi, s.track_position]
    : [s.track_position, s.span_lo, s.track_position, s.span_hi];
}
function placedRect(s) {
  const w = s.width;
  return s.horiz
    ? {x: s.span_lo, y: s.track_position - w/2, width: s.span_hi - s.span_lo, height: w}
    : {x: s.track_position - w/2, y: s.span_lo, width: w, height: s.span_hi - s.span_lo};
}

// DisplayGeom: place each segment at the CENTER of its slide window (or its
// nominal perp if unbounded), then snap each connecting endpoint to its partner
// segment's display perp so junctions visually meet. Ported from
// src/viz_explorer/draw.py (perp-centering + endpoint snapping); pure geometry
// over the serialized ConnSeg `analysis`, validated against the golden snapshot.
function computeDisplay(analysis) {
  const perp = analysis.map(a =>
    (a.perp_lo !== null && a.perp_hi !== null) ? (a.perp_lo + a.perp_hi) / 2 : a.perp_pos);
  const alo = analysis.map(a => a.along_lo);
  const ahi = analysis.map(a => a.along_hi);
  analysis.forEach((a, i) => {
    for (const c of a.conns) {
      if (c.kind !== "SEG" || c.seg_idx < 0 || c.seg_idx >= perp.length) continue;
      const adj = perp[c.seg_idx];                // partner's display perp
      // draw.py Pass B: snap ONLY a connection incident to an endpoint (at_pos
      // within 1 unit of along_lo/hi) and REPLACE that endpoint with the
      // partner's display perp. NOT min/max — extend-only overdraws a segment
      // whose true endpoint moves inward, and snapping a mid-segment T-tap (no
      // endpoint gate) stretches the line to a far partner (overextension bug).
      if (Math.abs(c.at_pos - a.along_lo) <= 1) alo[i] = adj;
      else if (Math.abs(c.at_pos - a.along_hi) <= 1) ahi[i] = adj;
    }
  });
  return {perp, alo, ahi};
}

function drawGeneration(g, W, H) {
  let cand, lbl;
  if (EDIT) {                                   // draw the edit working copy
    cand = EDIT.topology;
    lbl = `EDITING bundle ${EDIT.bundle_id} · ${cand.segments.length} seg(s)`;
    PINNED_HERE = false;
  } else {
    const bundle = RENDER.bundles[0];
    if (!bundle) return;
    cand = bundle.candidates[CAND];
    const sb = (RENDER.state && RENDER.state.bundles[0]) || {};
    PINNED_HERE = !!(sb.pinned && sb.selected_index === CAND);
    const pin = PINNED_HERE ? " 📌PINNED" : "";
    lbl = `bundle ${bundle.id} · cand ${CAND + 1}/${bundle.candidates.length} · ${cand.type} · WL ${cand.estimated_wirelength}${pin}`;
  }
  setPinBtn();
  document.getElementById("candlbl").textContent = lbl;
  if (!cand.analysis.length && !cand.segments.length) return;
  const disp = computeDisplay(cand.analysis);
  cand.analysis.forEach((a, i) => {
    const s = cand.segments[i];
    const cls = "seg " + (s.is_jog ? "jog" : (a.horiz ? "H" : "V"));
    const p = disp.perp[i];
    if (a.horiz)
      el("line", {class: cls, x1: disp.alo[i], y1: p, x2: disp.ahi[i], y2: p}, g);
    else
      el("line", {class: cls, x1: p, y1: disp.alo[i], x2: p, y2: disp.ahi[i]}, g);
  });
  for (const bt of cand.seg_busterms)
    for (const side of ["start", "end"]) {
      const b = bt[side]; if (!b) continue;
      el("circle", {class: "rcv", cx: (b.bbox.x1 + b.bbox.x2)/2,
          cy: (b.bbox.y1 + b.bbox.y2)/2, r: Math.max(W, H) * 0.008}, g);
    }
}

function drawNuts(g) {
  const n = RENDER.nuts; if (!n) return;
  for (const s of n.segments) {
    const op = bundleAlpha(s.bundle_id);
    el("rect", Object.assign({class: "trackftp", opacity: op}, placedRect(s)), g);
    const [a, b, c, d2] = placedLine(s);
    el("line", {class: "track", opacity: op, x1: a, y1: b, x2: c, y2: d2}, g);
  }
  for (const o of n.overlap_details)   // overlaps stay full-opacity (congestion markers)
    el("rect", {class: "overlap", x: o.span_lo, y: o.perp_lo,
        width: o.span_hi - o.span_lo, height: o.perp_hi - o.perp_lo}, g);
}

function drawDetailed(g, span) {
  const d = RENDER.detailed; if (!d) return;
  for (const s of d.net_segments) {
    const [a, b, c, e] = placedLine(s);
    el("line", {class: "bit " + (s.horiz ? "H" : "V"), opacity: bundleAlpha(s.bundle_id),
        x1: a, y1: b, x2: c, y2: e}, g);
  }
  const r = span * 0.004;
  for (const v of d.net_vias)
    el("rect", {class: "via", opacity: bundleAlpha(v.bundle_id),
        x: v.x - r, y: v.y - r, width: 2*r, height: 2*r}, g);
}

connectWS();
initDemos();
refresh();
</script>
